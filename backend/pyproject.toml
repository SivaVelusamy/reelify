[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI relies on function calls (Depends/Query/...) in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Routers are imported after `app` is constructed; worker task modules after the
# Celery app is configured — both are deliberate late imports.
"app/main.py" = ["E402"]
"app/workers/__init__.py" = ["E402"]
# Test modules: conftest must set env vars before importing app (E402), and
# assertion one-liners are allowed to run long (E501).
"tests/*" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    # Celery task bodies: heavy media/broker stubs with real ffmpeg/S3 side
    # effects. Exercised only under a running worker, not the request path.
    "app/workers/*",
    # Social publish adapters: network-bound stubs (TikTok/IG/YouTube upload,
    # Slack/Teams webhooks). Only reached via the omitted worker layer.
    "app/services/publishing/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
