# Preserve the public scheme/host when this nginx sits behind another reverse
# proxy (VPS / Caddy / Cloudflare); otherwise use our own values.
map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $public_host {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the `backend` service via Docker's embedded DNS on every request,
    # so a recreated backend container (new IP) doesn't leave nginx stuck on a
    # stale address (502 "connection refused").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "http://backend:8000";

    # Source-video uploads can be large (app enforces its own 2 GB cap).
    client_max_body_size 2g;

    # Static assets with long cache
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy -> FastAPI backend (uses the variable so nginx re-resolves DNS)
    location /api {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_request_buffering off;   # stream large uploads straight through
        client_max_body_size 2g;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
