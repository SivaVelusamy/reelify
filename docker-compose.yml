name: reelify

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reelify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reelify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage-init:
    image: minio/mc
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-reelify-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" || true;
      mc mb -p local/$${STORAGE_BUCKET} || true;
      mc anonymous set download local/$${STORAGE_BUCKET}/public || true;
      echo 'storage-init done';
      "
    restart: "no"

  # Generates the YouTube session (poToken + visitor data) cobalt needs to
  # actually proxy YouTube streams when self-hosted.
  yt-session:
    image: ghcr.io/imputnet/yt-session-generator:webserver
    restart: unless-stopped

  # Self-hosted cobalt (https://cobalt.tools) — primary media downloader.
  # The worker reaches it at http://cobalt:9000; yt-dlp stays as the fallback.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    restart: unless-stopped
    depends_on:
      - yt-session
    environment:
      API_URL: "http://cobalt:9000/"
      YOUTUBE_SESSION_SERVER: "http://yt-session:8080"
      # A cobalt-format cookies.json can be mounted and referenced here later:
      # COOKIE_PATH: "/cookies.json"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: reelify-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["./entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build: ./backend
    image: reelify-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.workers", "worker", "--loglevel=info"]
    volumes:
      # Persist downloaded Whisper models across restarts.
      - whispercache:/home/appuser/.cache
      # Drop a Netscape cookies.txt in ./secrets and set
      # YT_DLP_COOKIES_FILE=/secrets/cookies.txt in .env for YouTube auth.
      - ./secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      cobalt:
        condition: service_started

  beat:
    build: ./backend
    image: reelify-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "app.workers", "beat", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Empty by default: the app calls the relative /api path, which nginx
        # proxies to the backend. Only set this to target a backend elsewhere.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  whispercache:
